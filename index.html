<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard USALI — Gestión Hotelera 2026</title>
<style>
:root{
  --navy:#0e2447; --silver:#8d929d; --white:#ffffff; --forest:#2b424a;
  --slate:#465768; --terracota:#ad4736; --sand:#aa806d; --stone:#d8cdc5;
  --bg:#ffffff; --bgCard:#f7f5f3; --bgAlt:#eee9e5; --border:#d8cdc5;
  --textMain:#0e2447; --textSub:#465768; --textMuted:#8d929d;
  --green:#2f7d4f; --red:#ad4736;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--textMain);
  font-family:Georgia,'Times New Roman',serif; -webkit-text-size-adjust:100%;}
body{overflow-x:hidden;}
h1,h2,h3,h4{font-family:Georgia,serif;margin:0;}
a{color:inherit;}
.header{background:var(--navy);color:var(--white);padding:18px 20px 14px;}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.header-title{font-size:20px;font-weight:bold;margin:0 0 4px;}
.header-sub{font-size:12px;color:var(--stone);margin:0;}
.badge{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
  border-radius:20px;padding:4px 12px;font-size:11px;letter-spacing:.03em;}
.cc-switch{display:flex;gap:8px;flex-wrap:wrap;}
.cc-btn{padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.3);
  background:transparent;color:var(--white);font-size:12px;cursor:pointer;font-family:inherit;}
.cc-btn.active{background:var(--white);color:var(--navy);border-color:var(--white);font-weight:bold;}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--bgAlt);border-bottom:1px solid var(--border);
  -webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{height:4px;}
.tab-btn{flex:0 0 auto;padding:10px 14px;font-size:12px;border:none;background:transparent;color:var(--textSub);
  cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-family:inherit;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--terracota);font-weight:bold;background:var(--white);}
.body{padding:14px;max-width:1280px;margin:0 auto;}
.grid{display:grid;gap:10px;}
.grid-auto{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:640px){ .grid-2,.grid-3{grid-template-columns:1fr 1fr;} }
.card{background:var(--bgCard);border:1px solid var(--border);border-radius:10px;padding:12px;}
.card h4{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--textMuted);margin-bottom:6px;font-weight:normal;}
.card .val{font-size:20px;font-weight:bold;color:var(--textMain);}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 0;}
.chip.up{color:var(--green);} .chip.down{color:var(--red);}
.chip-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.section-title{font-size:15px;font-weight:bold;margin:22px 0 10px;color:var(--navy);
  border-left:4px solid var(--terracota);padding-left:8px;}
.section-title:first-child{margin-top:0;}
.panel{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;}
.chart-wrap{position:relative;height:280px;width:100%;}
.chart-wrap.short{height:200px;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:8px;}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:560px;}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;}
thead th{background:var(--bgAlt);color:var(--textSub);font-size:10px;text-transform:uppercase;letter-spacing:.03em;
  position:sticky;top:0;}
tbody tr:hover{background:var(--bgAlt);cursor:pointer;}
tbody tr.bold td{font-weight:bold;background:var(--bgCard);}
tbody tr.l3 td{color:var(--textSub);font-size:11px;}
.tr-neg{color:var(--red);}
.tr-pos{color:var(--forest);}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:var(--bgAlt);color:var(--textSub);}
.btn{background:var(--navy);color:var(--white);border:none;border-radius:6px;padding:7px 14px;font-size:12px;
  cursor:pointer;font-family:inherit;}
.btn.secondary{background:var(--bgAlt);color:var(--textMain);}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.filters select,.filters input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;
  font-family:inherit;background:var(--white);color:var(--textMain);}
.filters input[type=text]{min-width:180px;}
.empty{color:var(--textMuted);font-size:12px;padding:20px;text-align:center;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:800px){ .two-col{grid-template-columns:1fr;} }
.alert{border-left:4px solid var(--terracota);background:#fbeceA;padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:10px;}
.alert.ok{border-left-color:var(--green);background:#eaf5ee;}
.small-muted{font-size:11px;color:var(--textMuted);}
.link-like{color:var(--terracota);cursor:pointer;text-decoration:underline;font-size:12px;}
.footer{padding:16px;text-align:center;font-size:11px;color:var(--textMuted);}
.expand-icon{display:inline-block;width:14px;color:var(--textMuted);}
@media (max-width:640px){
  .header-title{font-size:16px;}
  .card .val{font-size:16px;}
  .body{padding:8px;}
  .panel{padding:10px;}
}

</style>
</head>

function computeKpiCards(){

    var ebitda = line("EBITDA", m);
    var ocu = line("Ocupación", m);
    var adr = line("Tarifa Promedio Diaria NETO", m);
    var revpar = line("RevPAR NETO", m);
    var nd = line("Noches de habitación disponibles", m);

    var costoHab_r26 = (agrup("Costos Habitaciones",m).r26||0) + (agrup("Gastos Habitaciones",m).r26||0);
    var AG_IG = ["Ingresos Habitaciones","Ingresos Restaurant","Ingresos Minimarket","Ingresos Eventos","Otros Ingresos"];
    var ig_r26 = sumCuentasByAg(AG_IG,"r26",[m]), ig_p26 = sumCuentasByAg(AG_IG,"p26",[m]), ig_r25 = sumCuentasByAg(AG_IG,"r25",[m]);
    var mg_r26 = line("Total Margen Departamentales",m).r26||0, mg_p26=line("Total Margen Departamentales",m).p26||0, mg_r25=line("Total Margen Departamentales",m).r25||0;
    var gopPct_r26 = ig_r26>0 ? mg_r26/ig_r26 : null, gopPct_p26 = ig_p26>0?mg_p26/ig_p26:null, gopPct_r25 = ig_r25>0?mg_r25/ig_r25:null;
    var costRoomPct = hab.r26>0 ? costoHab_r26/hab.r26 : null;
    var sumDC = function(ag){ return DC().filter(function(x){return x.a===ag;}).reduce(function(a,x){return a+((x.meses[m]&&x.meses[m].r26)||0);},0); };
    var costoRest_dc = sumDC("Costos Restaurant")+sumDC("Costos Minimarket");
    var ingRest_dc = sumDC("Ingresos Restaurant")+sumDC("Ingresos Minimarket");
    var costRestPct = ingRest_dc>0 ? costoRest_dc/ingRest_dc : null;
    var trevPar = nd.r26>0 ? ing.r26/nd.r26 : null, trevPar25 = nd.r25>0?ing.r25/nd.r25:null, trevPar_p = nd.p26>0?ing.p26/nd.p26:null;

    return {
      mes:m,
      ocu:{v:ocu.r26,ref:ocu.p26,prev:ocu.r25,type:"pct"},
      adr:{v:adr.r26,ref:adr.p26,prev:adr.r25,type:"clp"},
      revpar:{v:revpar.r26,ref:revpar.p26,prev:revpar.r25,type:"clp"},
      trevpar:{v:trevPar,ref:trevPar_p,prev:trevPar25,type:"clp"},
      ing:{v:ing.r26,ref:ing.p26,prev:ing.r25,type:"clp"},
      rbo:{v:rbo.r26,ref:rbo.p26,prev:rbo.r25,type:"clp"},
      ebitda:{v:ebitda.r26,ref:ebitda.p26,prev:ebitda.r25,type:"clp"},
      gopPct:{v:gopPct_r26,ref:gopPct_p26,prev:gopPct_r25,type:"pct2"},
      costHabPct:{v:costRoomPct,ref:hab.p26>0?(((agrup("Costos Habitaciones",m).p26||0)+(agrup("Gastos Habitaciones",m).p26||0))/hab.p26):null,prev:null,type:"pct2"},
      costRestPct:{v:costRestPct,ref:rest.p26>0?(agrup("Costos Restaurant",m).p26||0)/rest.p26:null,prev:null,type:"pct2"},
    };

}

function computeKpiConsolidado(){
  var sum = function(key,campo){ return sumLine(key,campo,CLOSED_MONTHS); };
  var ing_r26=sum("Ingresos Totales Departamentales","r26"), ing_p26=sum("Ingresos Totales Departamentales","p26"), ing_r25=sum("Ingresos Totales Departamentales","r25");
  var rbo_r26=sum("Resultado Bruto de Operación","r26"), rbo_p26=sum("Resultado Bruto de Operación","p26"), rbo_r25=sum("Resultado Bruto de Operación","r25");
  var ebitda_r26=sum("EBITDA","r26"), ebitda_p26=sum("EBITDA","p26"), ebitda_r25=sum("EBITDA","r25");
  var nd_r26=sum("Noches de habitación disponibles","r26"), nd_p26=sum("Noches de habitación disponibles","p26"), nd_r25=sum("Noches de habitación disponibles","r25");
  var hab_r26=sum("Total Ingresos por habitaciones","r26"), hab_p26=sum("Total Ingresos por habitaciones","p26"), hab_r25=sum("Total Ingresos por habitaciones","r25");

  function weighted(campo){
    return CLOSED_MONTHS.reduce(function(a,m){
      var o=line("Ocupación",m)[campo]||0, n=line("Noches de habitación disponibles",m)[campo]||0;
      return a+o*n;
    },0);
  }
  var ocuNights_r26=weighted("r26"), ocuNights_p26=weighted("p26"), ocuNights_r25=weighted("r25");
  var ocu_r26 = nd_r26>0? ocuNights_r26/nd_r26 : null, ocu_p26 = nd_p26>0? ocuNights_p26/nd_p26 : null, ocu_r25 = nd_r25>0? ocuNights_r25/nd_r25 : null;
  var adr_r26 = ocuNights_r26>0? hab_r26/ocuNights_r26 : null, adr_p26 = ocuNights_p26>0? hab_p26/ocuNights_p26 : null, adr_r25 = ocuNights_r25>0? hab_r25/ocuNights_r25 : null;
  var revpar_r26 = nd_r26>0? hab_r26/nd_r26 : null, revpar_p26 = nd_p26>0? hab_p26/nd_p26 : null, revpar_r25 = nd_r25>0? hab_r25/nd_r25 : null;
  var trevpar_r26 = nd_r26>0? ing_r26/nd_r26 : null, trevpar_p26 = nd_p26>0? ing_p26/nd_p26 : null, trevpar_r25 = nd_r25>0? ing_r25/nd_r25 : null;

  var AG_ING_GRUP = ["Ingresos Habitaciones","Ingresos Restaurant","Ingresos Minimarket","Ingresos Eventos","Otros Ingresos"];
  var ingGrup_r26=sumCuentasByAg(AG_ING_GRUP,"r26",CLOSED_MONTHS), ingGrup_p26=sumCuentasByAg(AG_ING_GRUP,"p26",CLOSED_MONTHS), ingGrup_r25=sumCuentasByAg(AG_ING_GRUP,"r25",CLOSED_MONTHS);
  var mrgGrup_r26=sum("Total Margen Departamentales","r26"), mrgGrup_p26=sum("Total Margen Departamentales","p26"), mrgGrup_r25=sum("Total Margen Departamentales","r25");
  var gop_r26 = ingGrup_r26>0? mrgGrup_r26/ingGrup_r26 : null, gop_p26 = ingGrup_p26>0? mrgGrup_p26/ingGrup_p26 : null, gop_r25 = ingGrup_r25>0? mrgGrup_r25/ingGrup_r25 : null;

  var isCPB = state.cc === "Club Playa Blanca";
  var restFNS = (FNS_DATA.VR && FNS_DATA.VR["Restaurante"]) || {};
  var pbFNS = (FNS_DATA.VR && FNS_DATA.VR["Pool Bar"]) || {};
  var fns_ing_mp=0, fns_cos_mp=0;
  CLOSED_MONTHS.forEach(function(m){ var mk=MES_NUM_MAP[m]||""; fns_ing_mp += ((restFNS[mk]&&restFNS[mk].imp)||0)+((pbFNS[mk]&&pbFNS[mk].imp)||0); fns_cos_mp += ((restFNS[mk]&&restFNS[mk].coste)||0)+((pbFNS[mk]&&pbFNS[mk].coste)||0); });
  var mrgMP_r26 = (isCPB && fns_ing_mp>0) ? (fns_ing_mp-fns_cos_mp)/fns_ing_mp : null;

  var ingHab_r26=sumAgrup("Ingresos Habitaciones","r26",CLOSED_MONTHS), ingHab_p26=sumAgrup("Ingresos Habitaciones","p26",CLOSED_MONTHS), ingHab_r25=sumAgrup("Ingresos Habitaciones","r25",CLOSED_MONTHS);
  var cosHab_r26=sumAgrup("Costos Habitaciones","r26",CLOSED_MONTHS)+sumAgrup("Gastos Habitaciones","r26",CLOSED_MONTHS);
  var cosHab_p26=sumAgrup("Costos Habitaciones","p26",CLOSED_MONTHS)+sumAgrup("Gastos Habitaciones","p26",CLOSED_MONTHS);
  var cosHab_r25=sumAgrup("Costos Habitaciones","r25",CLOSED_MONTHS)+sumAgrup("Gastos Habitaciones","r25",CLOSED_MONTHS);
  var mrgHab_r26 = ingHab_r26>0?(ingHab_r26-cosHab_r26)/ingHab_r26:null, mrgHab_p26 = ingHab_p26>0?(ingHab_p26-cosHab_p26)/ingHab_p26:null, mrgHab_r25 = ingHab_r25>0?(ingHab_r25-cosHab_r25)/ingHab_r25:null;

  var AG_ING_C=["Ingresos Restaurant","Ingresos Minimarket"], AG_COST_C=["Costos Restaurant","Costos Minimarket"];
  var ingAabb_r26=sumCuentasByAg(AG_ING_C,"r26",CLOSED_MONTHS), ingAabb_p26=sumCuentasByAg(AG_ING_C,"p26",CLOSED_MONTHS), ingAabb_r25=sumCuentasByAg(AG_ING_C,"r25",CLOSED_MONTHS);
  var cosAabb_r26=sumCuentasByAg(AG_COST_C,"r26",CLOSED_MONTHS), cosAabb_p26=sumCuentasByAg(AG_COST_C,"p26",CLOSED_MONTHS), cosAabb_r25=sumCuentasByAg(AG_COST_C,"r25",CLOSED_MONTHS);
  var mrgAabb_r26 = ingAabb_r26>0?(ingAabb_r26-cosAabb_r26)/ingAabb_r26:null, mrgAabb_p26 = ingAabb_p26>0?(ingAabb_p26-cosAabb_p26)/ingAabb_p26:null, mrgAabb_r25 = ingAabb_r25>0?(ingAabb_r25-cosAabb_r25)/ingAabb_r25:null;

  var mrgOp_r26 = ing_r26>0?rbo_r26/ing_r26:null, mrgOp_p26 = ing_p26>0?rbo_p26/ing_p26:null, mrgOp_r25 = ing_r25>0?rbo_r25/ing_r25:null;
  var mrgEb_r26 = ing_r26>0?ebitda_r26/ing_r26:null, mrgEb_p26 = ing_p26>0?ebitda_p26/ing_p26:null, mrgEb_r25 = ing_r25>0?ebitda_r25/ing_r25:null;

  var label = CLOSED_MONTHS.length>1 ? ("Ene–"+monthAbbr(CLOSED_MONTHS[CLOSED_MONTHS.length-1])+" 2026") : (CLOSED_MONTHS[0]+" 2026");

  return {

    mrgMP:{v:mrgMP_r26,ref:null,prev:null,type:"pct2"},

  var isCPB = state.cc==="Club Playa Blanca";
  var AG_ING_GRUP = ["Ingresos Habitaciones","Ingresos Restaurant","Ingresos Minimarket","Ingresos Eventos","Otros Ingresos"];

  var mrgGrup_r26=line("Total Margen Departamentales",m).r26||0, mrgGrup_p26=line("Total Margen Departamentales",m).p26||0, mrgGrup_r25=line("Total Margen Departamentales",m).r25||0;
  var gop_r26=ingGrup_r26>0?mrgGrup_r26/ingGrup_r26:null, gop_p26=ingGrup_p26>0?mrgGrup_p26/ingGrup_p26:null, gop_r25=ingGrup_r25>0?mrgGrup_r25/ingGrup_r25:null;

  var mk2 = MES_NUM_MAP[m]||"";

  var ingHab_d=agrup("Ingresos Habitaciones",m).r26||0, cosHab_d=(agrup("Costos Habitaciones",m).r26||0)+(agrup("Gastos Habitaciones",m).r26||0);

  var mrgHab_d=ingHab_d>0?(ingHab_d-cosHab_d)/ingHab_d:null, mrgHabP=ingHabP>0?(ingHabP-cosHabP)/ingHabP:null, mrgHabR=ingHabR>0?(ingHabR-cosHabR)/ingHabR:null;
  var AG_ING_D=["Ingresos Restaurant","Ingresos Minimarket"], AG_COST_D=["Costos Restaurant","Costos Minimarket"];
  var ingA_d=sumCuentasByAg(AG_ING_D,"r26",[m]), cosA_d=sumCuentasByAg(AG_COST_D,"r26",[m]);

  var mrgAabb_d=ingA_d>0?(ingA_d-cosA_d)/ingA_d:null, mrgAabbP=ingAP>0?(ingAP-cosAP)/ingAP:null, mrgAabbR=ingAR>0?(ingAR-cosAR)/ingAR:null;
  var mrgOp_d=ing_r26>0?rbo_r26/ing_r26:null, mrgOpP=ing_p26>0?rbo_p26/ing_p26:null, mrgOpR=ing_r25>0?rbo_r25/ing_r25:null;

function computeDeviations(acumMonths, sortMode){
  var rows = [];
  DC().forEach(function(x){
    if (!x.a || !x.l) return;
    var r26 = acumMonths.reduce(function(a,m){ return a+((x.meses[m]&&x.meses[m].r26)||0); },0);
    var p26 = acumMonths.reduce(function(a,m){ return a+((x.meses[m]&&x.meses[m].p26)||0); },0);
    var r25 = acumMonths.reduce(function(a,m){ return a+((x.meses[m]&&x.meses[m].r25)||0); },0);
    if (r26===0 && p26===0) return;
    var vBud = p26!==0 ? (r26-p26)/Math.abs(p26) : null;
    var vYoy = r25!==0 ? (r26-r25)/Math.abs(r25) : null;
    rows.push({cod:x.c,label:x.l,ag:x.a,r26:r26,p26:p26,r25:r25,vBud:vBud,vYoy:vYoy,absBud:vBud!==null?Math.abs(vBud):0,absYoy:vYoy!==null?Math.abs(vYoy):0});
  });
  var sortFnBud = sortMode==="monto" ? function(a,b){return Math.abs(b.r26-b.p26)-Math.abs(a.r26-a.p26);} : function(a,b){return b.absBud-a.absBud;};
  var sortFnYoy = sortMode==="monto" ? function(a,b){return Math.abs(b.r26-b.r25)-Math.abs(a.r26-a.r25);} : function(a,b){return b.absYoy-a.absYoy;};
  var topBud = rows.filter(function(r){return r.vBud!==null && r.absBud>0.05;}).sort(sortFnBud).slice(0,10);
  var topYoy = rows.filter(function(r){return r.vYoy!==null && r.absYoy>0.05;}).sort(sortFnYoy).slice(0,10);
  return {topBud:topBud, topYoy:topYoy};
}
function devRowHTML(r, field){
  var vPct = field==="bud" ? r.vBud : r.vYoy;
  var ref = field==="bud" ? r.p26 : r.r25;
  var brecha = r.r26 - ref;
  var isGasto = /^Costos|^Gastos/.test(r.ag) || r.ag==="Gastos de Administración" || r.ag==="Gastos No Distribuidos";
  var favorable = isGasto ? (r.r26 < ref) : (r.r26 > ref);
  return '<tr data-dev-cuenta="'+esc(r.cod)+'" data-dev-label="'+esc(r.label)+'" data-dev-ag="'+esc(r.ag)+'">'+
    '<td style="text-align:left"><div style="font-weight:600">'+esc(r.label.length>30?r.label.slice(0,30)+"…":r.label)+'</div><div class="small-muted">'+esc(r.ag)+'</div></td>'+
    '<td class="'+(r.r26<0?'tr-neg':'')+'" style="font-weight:600">'+fmtM(r.r26)+'</td>'+
    '<td class="small-muted" style="font-style:italic">'+fmtM(ref)+'</td>'+
    '<td class="'+(favorable?'tr-pos':'tr-neg')+'" style="font-weight:700">'+(brecha>=0?"+":"")+fmtM(brecha)+'</td>'+
    '<td>'+(vPct===null?"":chip(favorable?Math.abs(vPct):-Math.abs(vPct), (Math.abs(vPct*100).toFixed(1))+"%"))+'</td></tr>';
}

  var pdvsArr = PDV_LIST.filter(function(p){ return state.pdv.pdvsSel[p]; });
  var mesesArr = MESES.filter(function(m){ return state.pdv.mesesSel[m]; });

  function sumVR(campo){ return pdvsArr.reduce(function(a,p){ return a+mesesArr.reduce(function(b,m){ return b+(((FNS.VR[p]||{})[m]||{})[campo]||0); },0); },0); }
  function sumTQ(campo){ return isCPB ? pdvsArr.reduce(function(a,p){ return a+mesesArr.reduce(function(b,m){ var rec=((FNS.TQ&&FNS.TQ[p])||{})[m]||{}; return b+(rec[campo]||0); },0); },0) : 0; }
  var imp_t = sumVR("imp");
  var coste_t = isCPB ? sumVR("coste") : 0;
  var pagado_t = isCPB ? sumTQ("pagado") : imp_t*1.19;
  var n_t = isCPB ? sumTQ("n") : sumVR("n");
  var margen_t = (isCPB && imp_t>0) ? (imp_t-coste_t)/imp_t : null;
  var ticket_t = n_t>0 ? pagado_t/n_t : 0;
  var imp_all_meses = pdvsArr.reduce(function(a,p){ return a+MESES.reduce(function(b,m){ return b+(((FNS.VR[p]||{})[m]||{}).imp||0); },0); },0);
  var share = imp_all_meses>0 ? imp_t/imp_all_meses : 1;

  function recetasData(){
    var merged = {};
    pdvsArr.forEach(function(p){
      var rd = (FNS.vr_receta && FNS.vr_receta[p]) || {};
      Object.keys(rd).forEach(function(r){ if (EXCLUIR_RECETAS[r]) return; merged[r]=(merged[r]||0)+rd[r]; });
    });
    return Object.keys(merged).map(function(r){return [r,merged[r]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,10)
      .map(function(pair){ return { receta: pair[0].length>22?pair[0].slice(0,22)+"…":pair[0], valor: Math.round(pair[1]*share/1e6*10)/10 }; });
  }
  function diaData(){
    var merged = {};
    pdvsArr.forEach(function(p){ var d=(FNS.vr_dia&&FNS.vr_dia[p])||{}; Object.keys(d).forEach(function(k){ merged[k]=(merged[k]||0)+d[k]; }); });
    return DIAS_ORDER.map(function(d){ return { dia:d.slice(0,3), valor: Math.round((merged[d]||0)*share/1e6*10)/10 }; });
  }
  function horaData(){
    if (!isCPB) return [];
    var merged={};
    pdvsArr.forEach(function(p){ var h=(FNS.tq_hora&&FNS.tq_hora[p])||{}; Object.keys(h).forEach(function(k){ merged[k]=(merged[k]||0)+h[k]; }); });
    var out=[]; for (var hh=0; hh<24; hh++){ var v=(merged[String(hh)]||0)*share/1e6; if (v>0) out.push({hora:String(hh).padStart(2,'0')+'h', neto:Math.round(v*10)/10}); }
    return out;
  }
  function pagosData(){
    if (!isCPB) return [];
    var merged={};
    pdvsArr.forEach(function(p){ var t=(FNS.tq_tipopago&&FNS.tq_tipopago[p])||{}; Object.keys(t).forEach(function(k){ merged[k]=(merged[k]||0)+t[k]; }); });
    return Object.keys(merged).map(function(k){ return {tipo:k.replace("Tarjeta ","T."), valor:Math.round(merged[k]*share/1e6*10)/10}; }).sort(function(a,b){return b.valor-a.valor;});
  }
  function canalData(){
    if (isCPB) return [];
    var c = FNS.vr_canal||{};
    return Object.keys(c).map(function(k){ return {canal:k.length>14?k.slice(0,14)+"…":k, valor:Math.round(c[k]/1e6*100)/100}; }).sort(function(a,b){return b.valor-a.valor;}).slice(0,8);
  }
  function habData(){
    if (isCPB) return [];
    var h = FNS.vr_hab||{};
    return Object.keys(h).map(function(k){ return {hab:k, valor:Math.round(h[k]/1000)}; }).sort(function(a,b){return b.valor-a.valor;}).slice(0,10);
  }

  var recetas = recetasData(), dia = diaData(), hora = horaData(), pagos = pagosData(), canal = canalData(), hab = habData();

  el.innerHTML =
    '<div class="panel">'+
      '<div class="filters"><span class="small-muted">Punto de venta:</span>'+
        PDV_LIST.map(function(p){ return '<button class="btn secondary" data-pdv="'+esc(p)+'" style="border-radius:20px;padding:4px 12px;font-size:11px;'+(state.pdv.pdvsSel[p]?('background:'+PDV_COLOR[p]+';color:#fff'):'')+'">'+esc(p)+'</button>'; }).join(' ')+
      '</div>'+
      '<div class="filters"><span class="small-muted">Mes:</span>'+
        MESES.map(function(m){ return '<button class="btn secondary" data-pdvmes="'+m+'" style="border-radius:20px;padding:4px 12px;font-size:11px;'+(state.pdv.mesesSel[m]?('background:'+TASCO.terracota+';color:#fff'):'')+'">'+esc(MESES_LABEL[m])+'</button>'; }).join(' ')+
      '</div>'+
    '</div>'+
    (isCPB && pdvsArr.indexOf("Restaurante")!==-1 ? '<div class="alert"><strong>Auditoría (Pipeline B — cruce FNS vs Contabilidad):</strong> la brecha entre ventas POS (FNS) e ingresos contabilizados de Restaurant CPB supera ±5% en los 6 meses cerrados a la fecha, sin patrón de signo fijo. Ambos lados validan exacto contra su fuente — no es un error de carga, es una diferencia operativa pendiente de explicar (consumos internos, atenciones comerciales, mermas, o conciliación de pasarela de pago).</div>' : '')+
    '<div class="grid grid-auto" style="margin-bottom:14px">'+
      kpiSimpleBox("Ventas Netas (FNS)", fmt(imp_t))+
      (isCPB ? kpiSimpleBox("Costo de Venta", fmt(coste_t)) : '')+
      (isCPB ? kpiSimpleBox("Margen Materia Prima", margen_t===null?"—":(margen_t*100).toFixed(1)+"%") : '')+
      kpiSimpleBox("N° Transacciones", n_t.toLocaleString('es-CL')) +
      kpiSimpleBox("Ticket Promedio", fmt(ticket_t))+
    '</div>'+
    '<div class="two-col">'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Top Recetas / Productos (MM CLP)</div><div class="chart-wrap"><canvas id="chRecetas"></canvas></div></div>'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Ventas por Día de Semana (MM CLP)</div><div class="chart-wrap"><canvas id="chDia"></canvas></div></div>'+
    '</div>'+
    (isCPB ? ('<div class="two-col">'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Ventas por Hora del Día (MM CLP)</div><div class="chart-wrap"><canvas id="chHora"></canvas></div></div>'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Tipo de Pago (MM CLP)</div><div class="chart-wrap"><canvas id="chPagos"></canvas></div></div>'+
    '</div>') : ('<div class="two-col">'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Ventas por Canal (MM CLP)</div><div class="chart-wrap"><canvas id="chCanal"></canvas></div></div>'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Top Habitaciones (K CLP)</div><div class="chart-wrap"><canvas id="chHab"></canvas></div></div>'+
    '</div>'));

  el.querySelectorAll('[data-pdv]').forEach(function(btn){ btn.addEventListener('click', function(){
    var p = btn.getAttribute('data-pdv'); var sel=state.pdv.pdvsSel; var count=Object.keys(sel).filter(function(k){return sel[k];}).length;
    if (sel[p]){ if (count>1) sel[p]=false; } else sel[p]=true; render();
  }); });
  el.querySelectorAll('[data-pdvmes]').forEach(function(btn){ btn.addEventListener('click', function(){
    var m = btn.getAttribute('data-pdvmes'); var sel=state.pdv.mesesSel; var count=Object.keys(sel).filter(function(k){return sel[k];}).length;
    if (sel[m]){ if (count>1) sel[m]=false; } else sel[m]=true; render();
  }); });

  mkChart('chRecetas', { type:'bar', data:{ labels:recetas.map(function(d){return d.receta;}), datasets:[{label:'MM CLP', data:recetas.map(function(d){return d.valor;}), backgroundColor:TASCO.navy}] },
    options: Object.assign(chartOpts({ tooltipSuffix:'M', prefix:'$' }), {indexAxis:'y'}) });
  mkChart('chDia', { type:'bar', data:{ labels:dia.map(function(d){return d.dia;}), datasets:[{label:'MM CLP', data:dia.map(function(d){return d.valor;}), backgroundColor:TASCO.sand}] }, options: chartOpts({tooltipSuffix:'M', prefix:'$'}) });
  if (isCPB){
    mkChart('chHora', { type:'bar', data:{ labels:hora.map(function(d){return d.hora;}), datasets:[{label:'MM CLP', data:hora.map(function(d){return d.neto;}), backgroundColor:TASCO.forest}] }, options: chartOpts({tooltipSuffix:'M', prefix:'$'}) });
    mkChart('chPagos', { type:'doughnut', data:{ labels:pagos.map(function(d){return d.tipo;}), datasets:[{data:pagos.map(function(d){return d.valor;}), backgroundColor:[TASCO.navy,TASCO.terracota,TASCO.sand,TASCO.forest,TASCO.slate,TASCO.silver]}] }, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}} });
  } else {
    mkChart('chCanal', { type:'bar', data:{ labels:canal.map(function(d){return d.canal;}), datasets:[{label:'MM CLP', data:canal.map(function(d){return d.valor;}), backgroundColor:TASCO.navy}] }, options: chartOpts({tooltipSuffix:'M', prefix:'$'}) });
    mkChart('chHab', { type:'bar', data:{ labels:hab.map(function(d){return d.hab;}), datasets:[{label:'K CLP', data:hab.map(function(d){return d.valor;}), backgroundColor:TASCO.sand}] }, options: Object.assign(chartOpts({tooltipSuffix:'K', prefix:'$'}),{indexAxis:'y'}) });
  }
}
function kpiSimpleBox(label, val){ return '<div class="card"><h4>'+esc(label)+'</h4><div class="val">'+val+'</div></div>'; }

/* ==================================================================
   TAB: Otros Ingresos
   ================================================================== */
function renderOtros(el){
  var key = state.cc==="Club Playa Blanca" ? "CPB" : "ML";
  var data = OTROS_INGRESOS[key];
  var mesFiltro = state.otros.mesFiltro;

  var mesesConDatos = Object.keys(data.mes_total);
  var svcEntries = Object.keys(data.svc_total).map(function(k){ return [k, mesFiltro==="Todos" ? data.svc_total[k] : ((data.svc_mes[k]||{})[mesFiltro]||0)]; })
    .filter(function(p){return p[1]>0;}).sort(function(a,b){return b[1]-a[1];});
  var canalEntries = Object.keys(data.canal_total).map(function(k){ return [k, mesFiltro==="Todos" ? data.canal_total[k] : ((data.canal_mes[k]||{})[mesFiltro]||0)]; })
    .filter(function(p){return p[1]>0;}).sort(function(a,b){return b[1]-a[1];});
  var habEntries = Object.keys(data.hab_total).map(function(k){ return [k, data.hab_total[k]]; }).filter(function(p){return p[1]>0;}).sort(function(a,b){return b[1]-a[1];}).slice(0,12);
  var totalPeriodo = Object.values(data.mes_total).reduce(function(a,b){return a+b;},0);

  el.innerHTML =
    '<div class="panel"><div class="filters"><span class="small-muted">Mes:</span>'+
      ["Todos"].concat(CLOSED_MONTHS.filter(function(m){return mesesConDatos.indexOf(m)!==-1;})).map(function(m){
        return '<button class="btn secondary" data-otros-mes="'+m+'" style="border-radius:20px;padding:4px 12px;font-size:11px;'+(mesFiltro===m?'background:'+TASCO.terracota+';color:#fff':'')+'">'+esc(m)+'</button>';
      }).join(' ')+
    '</div></div>'+
    '<div class="grid grid-auto" style="margin-bottom:14px">'+
      kpiSimpleBox("Total período "+esc(monthAbbr(CLOSED_MONTHS[0]))+"–"+esc(monthAbbr(CLOSED_MONTHS[CLOSED_MONTHS.length-1])), fmt(totalPeriodo))+
      kpiSimpleBox("N° de servicios distintos", Object.keys(data.svc_total).length)+
      kpiSimpleBox("N° canales", Object.keys(data.canal_total).length)+
    '</div>'+
    '<div class="two-col">'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Otros Ingresos por Mes (MM CLP)</div><div class="chart-wrap"><canvas id="chOtrosMes"></canvas></div></div>'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Por Canal (MM CLP)</div><div class="chart-wrap"><canvas id="chOtrosCanal"></canvas></div></div>'+
    '</div>'+
    '<div class="panel"><div class="section-title" style="margin-top:0">Desglose por Servicio'+(mesFiltro!=="Todos"?(" — "+esc(mesFiltro)):"")+'</div>'+
      '<div class="table-scroll"><table><thead><tr><th style="text-align:left">Servicio / Consumo</th><th>Monto</th><th>% del total</th></tr></thead><tbody>'+
      (svcEntries.length===0?'<tr><td colspan="3" class="empty">Sin datos para el filtro seleccionado</td></tr>':svcEntries.map(function(p){
        var pct = totalPeriodo? (p[1]/(mesFiltro==="Todos"?totalPeriodo:(data.mes_total[mesFiltro]||1))*100).toFixed(1):0;
        return '<tr><td style="text-align:left">'+esc(p[0])+'</td><td>'+fmt(p[1])+'</td><td>'+pct+'%</td></tr>';
      }).join(''))+
      '</tbody></table></div></div>'+
    '<div class="panel"><div class="section-title" style="margin-top:0">Top Habitaciones (todo el período)</div>'+
      '<div class="table-scroll"><table><thead><tr><th style="text-align:left">Habitación</th><th>Monto</th></tr></thead><tbody>'+
      habEntries.map(function(p){ return '<tr><td style="text-align:left">'+esc(p[0])+'</td><td>'+fmt(p[1])+'</td></tr>'; }).join('')+
      '</tbody></table></div></div>';

  el.querySelectorAll('[data-otros-mes]').forEach(function(btn){ btn.addEventListener('click', function(){ state.otros.mesFiltro = btn.getAttribute('data-otros-mes'); render(); }); });

  var mesLabels = CLOSED_MONTHS.filter(function(m){return mesesConDatos.indexOf(m)!==-1;});
  mkChart('chOtrosMes', { type:'bar', data:{ labels: mesLabels.map(monthAbbr), datasets:[{label:'MM CLP', data: mesLabels.map(function(m){return Math.round((data.mes_total[m]||0)/1e6*10)/10;}), backgroundColor:TASCO.navy}] }, options: chartOpts({tooltipSuffix:'M', prefix:'$'}) });
  mkChart('chOtrosCanal', { type:'bar', data:{ labels: canalEntries.slice(0,8).map(function(p){return p[0];}), datasets:[{label:'MM CLP', data: canalEntries.slice(0,8).map(function(p){return Math.round(p[1]/1e6*10)/10;}), backgroundColor:TASCO.sand}] }, options: Object.assign(chartOpts({tooltipSuffix:'M', prefix:'$'}),{indexAxis:'y'}) });
}

/* ==================================================================
   TAB: Control Diferencias USALI / Contabilidad
   ================================================================== */
function renderConciliacion(el){
  var dd = DIFF_DATA[state.cc];
  var LINES = ["Ingresos Totales Departamentales","Gastos Totales Departamentales","Gastos Totales No Distribuidos","Gastos de Administración"];
  var byLabel = {}; dd.lines.forEach(function(l){ byLabel[l.label]=l; });

  el.innerHTML =
    '<div class="alert ok"><strong>✓ Conciliación OK:</strong> todas las líneas USALI calzan exacto con Contabilidad (Real GL) en los meses cerrados — diferencia = 0 en las '+LINES.length+' líneas de control.</div>'+
    '<div class="panel"><div class="section-title" style="margin-top:0">Líneas de Control (USALI vs Contabilidad)</div>'+
    '<div class="table-scroll"><table><thead><tr><th style="text-align:left">Línea</th>'+CLOSED_MONTHS.map(function(m){return '<th>'+esc(monthAbbr(m))+'</th>';}).join('')+'<th>Anual</th></tr></thead><tbody>'+
    LINES.map(function(l){
      var row = byLabel[l];
      return '<tr><td style="text-align:left">'+esc(l)+'</td>'+
        CLOSED_MONTHS.map(function(m){ var c=row.months[m]||{usali:0,activos:0,dif:0}; return '<td title="dif: '+c.dif+'">'+fmt(c.usali)+'</td>'; }).join('')+
        '<td style="font-weight:700">'+fmt((row.months.Anual||{}).usali||0)+'</td></tr>';
    }).join('')+
    '</tbody></table></div></div>'+
    '<div class="two-col">'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Cuentas "Sin Agrupación" con movimiento</div>'+
        '<div class="small-muted" style="margin-bottom:8px">Ajustes contables legítimos sin agrupación USALI asignada — informativo, no es un error.</div>'+
        (dd.sin_ag.length===0 ? '<div class="empty">Ninguna</div>' :
          '<div class="table-scroll"><table><thead><tr><th style="text-align:left">Cuenta</th><th>Anual</th></tr></thead><tbody>'+
          dd.sin_ag.map(function(c){ return '<tr data-sinag-cuenta="'+esc(c.c)+'" data-sinag-label="'+esc(c.l)+'"><td style="text-align:left"><span style="font-family:monospace;font-size:10px;color:'+TASCO.textMuted+'">'+esc(c.c)+'</span> '+esc(c.l)+'</td><td>'+fmt(c.months.Anual||0)+'</td></tr>'; }).join('')+
          '</tbody></table></div>')+
      '</div>'+
      '<div class="panel"><div class="section-title" style="margin-top:0">Cuentas con presupuesto sin movimiento real</div>'+
        (dd.sin_mov.length===0 ? '<div class="empty">Ninguna</div>' :
          '<div class="table-scroll"><table><thead><tr><th style="text-align:left">Cuenta</th></tr></thead><tbody>'+
          dd.sin_mov.map(function(c){ return '<tr><td style="text-align:left">'+esc(typeof c==="string"?c:(c.l||c.c||JSON.stringify(c)))+'</td></tr>'; }).join('')+
          '</tbody></table></div>')+
      '</div>'+
    '</div>';

  el.querySelectorAll('[data-sinag-cuenta]').forEach(function(tr){
    tr.addEventListener('click', function(){ goToRevision({ c: tr.getAttribute('data-sinag-cuenta'), l: tr.getAttribute('data-sinag-label'), a: "Sin Agrupación", from:"conciliacion" }); });
  });
}

/* ==================================================================
   Bootstrap
   ================================================================== */
document.addEventListener('DOMContentLoaded', function(){ render(); });
if (document.readyState === "complete" || document.readyState === "interactive") { render(); }

})();

</script>
</body>
